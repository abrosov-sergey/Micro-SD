apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-service
  labels:
    app: email-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: email-service
  template:
    metadata:
      labels:
        app: email-service
    spec:
      containers:
      - name: email-container
        image: awesomecosmonaut/email-app:latest
        ports:
        - containerPort: 8083
        resources:
          requests:
            memory: "100Mi"
            cpu: "200m"
          limits:
            memory: "128Mi"
            cpu: "250m"

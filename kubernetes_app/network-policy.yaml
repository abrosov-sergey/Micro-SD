---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: metal-project
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /metal-project/config-service(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: config-service-service
                port:
                  number: 8080

          - path: /metal-project/dataprocessing-service(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: dataprocessing-service
                port:
                  number: 8081
          - path: /metal-project/db-service(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: db-service-service
                port:
                  number: 8082
          - path: /metal-project/email-service(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: email-service
                port:
                  number: 8083
          - path: /metal-project/session-service(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: session-service-service
                port:
                  number: 8084
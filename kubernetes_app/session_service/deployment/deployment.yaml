apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-service-app
  labels:
    app: session-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: session-service
  template:
    metadata:
      labels:
        app: session-service
    spec:
      containers:
      - name: session-service-container
        image: awesomecosmonaut/session-service-app:latest
        ports:
        - containerPort: 8084
        resources:
          requests:
            memory: "100Mi"
            cpu: "200m"
          limits:
            memory: "128Mi"
            cpu: "250m"
